<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="style.css">
  <script src="supabase-config.js" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="task-store.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <span class="eyebrow">每一天，前進一點點</span>
      <h1>我的待辦清單<span class="heading-dot">。</span></h1>
      <p class="subtitle">把想做的事記下來，留點空間給生活。</p>
    </header>
    <section class="panel auth-panel" aria-label="會員帳號">
      <h2>會員帳號</h2>
      <p id="auth-status" role="status">正在檢查登入狀態，本機清單仍可查看。</p>
      <form id="auth-form">
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
        <label for="password">密碼（至少 8 字元）</label><input id="password" type="password" minlength="8" autocomplete="current-password" required>
        <div class="auth-actions"><button type="submit" id="login">登入</button><button type="submit" id="signup">註冊</button></div>
      </form>
      <div class="auth-actions"><button id="logout" type="button" hidden>登出</button><button id="reload-cloud" type="button" hidden>重新載入雲端清單</button></div>
      <p id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <section class="panel import-panel" id="import-panel" aria-label="本機資料匯入" hidden>
      <h2>尚未匯入的本機清單</h2>
      <p id="import-summary"></p><ul id="import-preview"></ul>
      <p>這份資料沒有帳號資訊。請先下載備份，再確認它屬於目前登入的帳號；原始本機清單不會清除。</p>
      <button id="backup" type="button">下載本機備份</button>
      <label class="import-consent"><input id="import-consent" type="checkbox"> 我確認預覽中的任務屬於目前帳號，並已完成備份</label>
      <button id="import-tasks" type="button" disabled>確認匯入目前帳號</button>
      <p id="import-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-label="待辦事項管理">
      <p id="mode-label">本機模式 · 資料儲存在這個瀏覽器</p>
      <form id="todo-form">
        <label for="todo-input">新增待辦事項</label>
        <div class="input-row">
          <input id="todo-input" type="text" maxlength="200" placeholder="接下來，想完成什麼？" autocomplete="off" required>
          <button class="add-button" type="submit">＋ 新增</button>
        </div>
        <div class="task-options">
          <div><label for="category">分類</label><select id="category"><option>工作</option><option selected>生活</option><option>學習</option></select></div>
          <div><label for="priority">優先順序</label><select id="priority"><option>高</option><option selected>中</option><option>低</option></select></div>
          <div><label for="due-date">截止日期（選填）</label><input id="due-date" type="date"></div>
        </div>
      </form>
      <div class="progress-summary">
        <p id="progress-text" aria-live="polite">已完成 0 / 0 項 · 0%</p>
        <progress id="progress" max="100" value="0" aria-label="全部任務完成進度"></progress>
      </div>
      <div class="filter-row"><label for="category-filter">依分類篩選</label><select id="category-filter"><option value="全部">全部</option><option>工作</option><option>生活</option><option>學習</option></select></div>
      <div class="list-heading"><h2>你的清單</h2><span id="count">0 項待完成</span></div>
      <ul id="todo-list" aria-label="待辦清單"></ul>
      <div id="empty-state"><span class="empty-icon" aria-hidden="true">✓</span><h3>今天，從一件小事開始</h3><p>新增第一項待辦，慢慢完成你的計畫。</p></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <footer>未登入使用本機清單；登入後使用個人雲端清單。</footer>
  </main>
</body>
</html>
